services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bermudeztech_portfolio
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/sqlite.db
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    restart: always

volumes:
  sqlite-data:
    driver: local
